[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svtypes-coverage-tools"
version = "0.1.0"
description = "Independent coverage scanner, catalog, browser, and proposal tools for SvTypes"
requires-python = ">=3.11"
dependencies = ["svtypes-design-manifest"]

[project.scripts]
svtypes-coverage = "svtypes_coverage_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svtypes_coverage_tools = ["schemas/*.json", "gui_bin_canvas.js"]
