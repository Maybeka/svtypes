[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svtypes-backend-sdk"
version = "0.1.0"
description = "Independent backend protocol and artifact writer for SvTypes"
requires-python = ">=3.11"
dependencies = ["svtypes-design-manifest"]

[project.scripts]
svtypes-backend = "svtypes_backend_sdk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
