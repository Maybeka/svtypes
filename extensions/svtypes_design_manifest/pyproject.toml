[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svtypes-design-manifest"
version = "0.1.0"
description = "Read-only design-manifest bridge for SvTypes extensions"
requires-python = ">=3.11"
dependencies = ["svtypes"]

[project.scripts]
svtypes-design-export = "svtypes_design_manifest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svtypes_design_manifest = ["schemas/*.json"]
